[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lfecli"
version = "0.1.0"
description = "Preparation and analysis tools for the LfE ADAS study"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "polars>=1.0",
  "scipy>=1.11",
]

[project.scripts]
lfecli = "lfecli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["lfecli", "preprocessing", "adas", "eyetracking"]
